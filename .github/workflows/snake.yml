name: Serpente de contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00h de Fortaleza
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=3B82F6&color_dots=#ebedf0,#d9f99d,#a3e635,#65a30d,#3f6212
            dist/github-snake-dark.svg?palette=github-dark&color_snake=84CC16&color_dots=#161b22,#0c4a6e,#0e7490,#22d3ee,#a5f3fc
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
