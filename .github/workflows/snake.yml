name: Serpente de contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00h de Fortaleza
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=EC4899&color_dots=#ebedf0,#e9d5ff,#c084fc,#a855f7,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=#161b22,#3b0764,#6d28d9,#a855f7,#ec4899
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
