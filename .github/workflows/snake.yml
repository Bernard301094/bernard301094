name: Serpente de contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00h de Fortaleza
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=60A5FA&color_dots=#161b22,#0f2747,#1a4f8a,#1a72d4,#60a5fa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
